name: verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: local-bootstrap-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/init_env.py
      - run: PGPASSWORD=local-bootstrap-only psql -h localhost -U postgres -d platform -f infra/compose/init.sql
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv tool run pip-audit --path .venv/lib/python3.12/site-packages
      - run: uv run pytest -q
        env:
          INTEGRATION: "1"
          DATABASE_URL: postgresql+psycopg://platform:local-only@127.0.0.1:5432/platform
          REDIS_URL: redis://127.0.0.1:6379/0
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
